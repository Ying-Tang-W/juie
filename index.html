<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>图记 · 图片标注相册</title>
<meta name="description" content="图记：在图片上打点、写备注、公开分享的标注相册">
<meta name="theme-color" content="#eef2f7">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="图记">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/styles.css?v=20261114-redesign">
</head>
<body class="logged-out">

<!-- 图标库：统一 24px 线性图标，颜色随 currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9h8M8 12h5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 19 12 5l7 14M8 14h8"/></symbol>
    <symbol id="i-clean" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.7-1.5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></symbol>
    <symbol id="i-drawer" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/></symbol>
    <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  </defs>
</svg>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-veil" id="bgVeil"></div>

<!-- ============ 顶部导航 ============ -->
<header class="navbar acrylic">
  <div class="brand">
    <img class="brand-mark" src="assets/icon.svg" alt="">
    <div class="brand-text">
      <strong>图记</strong>
      <span>图片标注相册</span>
    </div>
  </div>

  <nav class="nav-tabs" id="navTabs" aria-label="相册">
    <button class="nav-tab is-active" data-tab="mine"><svg class="ico"><use href="#i-grid"/></svg><span>我的相册</span></button>
    <button class="nav-tab" data-tab="public"><svg class="ico"><use href="#i-globe"/></svg><span>公开图库</span></button>
    <button class="nav-tab" data-tab="upload"><svg class="ico"><use href="#i-upload"/></svg><span>上传照片</span></button>
  </nav>

  <div class="nav-right">
    <button class="user-chip" id="userChip" title="账号菜单" aria-label="账号菜单" aria-haspopup="true">
      <span class="avatar" id="chipAvatar">樱</span>
      <span class="user-chip-name" id="chipName">樱糖</span>
      <svg class="ico chip-caret"><use href="#i-chev-down"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" title="外观设置" aria-label="外观设置"><svg class="ico"><use href="#i-sliders"/></svg></button>

    <div class="user-menu acrylic" id="userMenu" hidden>
      <div class="um-head">
        <span class="avatar lg" id="menuAvatar">樱</span>
        <div class="um-meta">
          <div class="um-name" id="menuName">樱糖</div>
          <div class="um-desc" id="menuDesc">图片所有者</div>
        </div>
      </div>
      <button class="um-item" id="umAvatar"><svg class="ico"><use href="#i-image"/></svg>更换头像</button>
      <button class="um-item danger" id="umLogout"><svg class="ico"><use href="#i-logout"/></svg>退出登录</button>
    </div>
  </div>
</header>

<!-- ============ 主体工作区 ============ -->
<main class="workspace" id="workspace" data-layout="split">
  <div class="drawer-mask" id="drawerMask"></div>

  <!-- 左侧图库 -->
  <aside class="sidebar acrylic" id="sidebar" aria-label="图库">
    <div class="sheet-handle" id="sheetHandle" role="button" aria-label="收起图库"><span></span></div>
    <div class="sidebar-head">
      <div class="search-box">
        <svg class="ico search-icon"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" placeholder="搜索标注、备注或上传者" autocomplete="off" enterkeyhint="search" aria-label="搜索">
        <button class="clear-btn" id="clearSearch" title="清空" aria-label="清空搜索"><svg class="ico"><use href="#i-x"/></svg></button>
      </div>
      <div class="sidebar-actions">
        <button class="tool-btn" id="btnCollapse" title="收起图库，画布铺满" aria-label="收起图库"><svg class="ico"><use href="#i-panel"/></svg><span>收起</span></button>
        <button class="tool-btn" id="btnExpand" title="图库铺满，便于批量选图" aria-label="图库全屏"><svg class="ico"><use href="#i-expand"/></svg><span>全屏</span></button>
      </div>
      <div class="sidebar-stat" id="sidebarStat">共 0 张</div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>

    <div class="bulk-bar" id="bulkBar" hidden>
      <span id="bulkCount">已选 0 张</span>
      <div class="bulk-actions">
        <button class="mini-btn" data-bulk="public">公开</button>
        <button class="mini-btn" data-bulk="private">私有</button>
        <button class="mini-btn danger" data-bulk="delete"><svg class="ico"><use href="#i-trash"/></svg>删除</button>
        <button class="mini-btn ghost" data-bulk="cancel">取消</button>
      </div>
    </div>
  </aside>

  <div class="divider" id="divider" title="拖动调整宽度" role="separator" aria-orientation="vertical"><span class="divider-grip"></span></div>

  <!-- 中间画布 -->
  <section class="stage" id="stage">
    <div class="stage-head acrylic">
      <div class="stage-title">
        <span class="photo-title" id="photoTitle">未选择图片</span>
        <span class="vis-badge" id="visBadge">—</span>
      </div>

      <div class="stage-tools">
        <label class="switch" id="visSwitchWrap" title="仅图片所有者可切换公开/私有">
          <input type="checkbox" id="visSwitch">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label" id="visSwitchLabel">私有</span>
        </label>
        <label class="switch" id="editSwitchWrap" title="仅图片所有者可编辑（快捷键 E）">
          <input type="checkbox" id="editSwitch">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">编辑</span>
        </label>
      </div>

      <div class="zoom-group">
        <button class="icon-btn sm" id="btnZoomOut" title="缩小（−）" aria-label="缩小"><svg class="ico"><use href="#i-minus"/></svg></button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="icon-btn sm" id="btnZoomIn" title="放大（+）" aria-label="放大"><svg class="ico"><use href="#i-plus"/></svg></button>
        <button class="icon-btn sm" id="btnFit" title="适应窗口（0）" aria-label="适应窗口"><svg class="ico"><use href="#i-fit"/></svg></button>
      </div>
    </div>

    <div class="canvas" id="canvas">
      <div class="viewport" id="viewport">
        <img class="photo" id="photo" alt="">
      </div>
      <svg class="leads" id="leads" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="marks" id="marks"></div>

      <button class="nav-arrow prev acrylic" id="btnPrev" title="上一张（[）" aria-label="上一张"><svg class="ico"><use href="#i-chev-left"/></svg></button>
      <button class="nav-arrow next acrylic" id="btnNext" title="下一张（]）" aria-label="下一张"><svg class="ico"><use href="#i-chev-right"/></svg></button>
      <button class="reveal-btn acrylic" id="btnReveal" title="展开图库" aria-label="展开图库"><svg class="ico"><use href="#i-chev-right"/></svg></button>
      <button class="drawer-btn acrylic" id="btnDrawer" aria-label="打开图库" aria-expanded="false"><svg class="ico"><use href="#i-drawer"/></svg><span>图库</span><span class="drawer-count" id="drawerCount"></span></button>
      <div class="canvas-loading" aria-hidden="true"><i></i></div>

      <div class="canvas-empty" id="canvasEmpty">
        <div class="empty-ill"><svg class="ico"><use href="#i-image"/></svg></div>
        <p id="emptyText">从左侧选择一张图片开始标注</p>
      </div>
    </div>
  </section>
</main>

<!-- ============ 底部控制栏 ============ -->
<footer class="dock acrylic">
  <div class="dock-inner">
    <div class="dock-seg" id="dockSeg" role="radiogroup" aria-label="标注显示方式">
      <button class="seg-btn is-active" data-mode="pointer" role="radio" aria-checked="true" title="显示点（1）">
        <svg class="ico seg-ico"><use href="#i-target"/></svg><span class="seg-text">显示点</span><span class="seg-tag" id="segTag">名字</span><svg class="ico seg-caret"><use href="#i-chev-down"/></svg>
      </button>
      <button class="seg-btn" data-mode="note" role="radio" aria-checked="false" title="显示备注（2）">
        <svg class="ico seg-ico"><use href="#i-note"/></svg><span class="seg-text">显示备注</span>
      </button>
      <button class="seg-btn" data-mode="name" role="radio" aria-checked="false" title="显示名字（3）">
        <svg class="ico seg-ico"><use href="#i-text"/></svg><span class="seg-text">显示名字</span>
      </button>
      <button class="seg-btn seg-clean" data-mode="clean" role="radio" aria-checked="false" title="纯净模式（4）">
        <svg class="ico seg-ico"><use href="#i-clean"/></svg><span class="seg-text">纯净模式</span>
      </button>

      <div class="submenu acrylic" id="submenu" hidden>
        <div class="submenu-title">点击光圈后显示</div>
        <button class="sub-btn is-active" data-sub="name">显示名字</button>
        <button class="sub-btn" data-sub="note">显示备注</button>
      </div>
    </div>

    <div class="dock-meta" id="dockMeta">
      <span class="meta-item" id="metaMode">模式：显示点 · 名字</span>
      <span class="meta-sep" id="metaMarksSep"></span>
      <span class="meta-item" id="metaMarks">标注 0 个</span>
      <span class="meta-sep"></span>
      <span class="meta-item" id="metaOwner">—</span>
    </div>

    <div class="dock-hint" id="dockHint">滚轮缩放 · 拖拽平移</div>
  </div>
</footer>

<!-- 打点弹窗 -->
<div class="mark-popover acrylic" id="markPopover" hidden>
  <div class="pop-head">
    <span id="popTitle">新增标注点</span>
    <button class="pop-del" id="markDelete" title="删除该标注点"><svg class="ico"><use href="#i-trash"/></svg>删除</button>
  </div>
  <div class="pop-row">
    <label for="markName">标记名</label>
    <input type="text" id="markName" class="input-sm" placeholder="如：主体建筑" maxlength="24" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="pop-row">
    <label for="markNote">备注</label>
    <textarea id="markNote" class="input-lg" placeholder="补充描述、问题或处理方式" rows="4"></textarea>
  </div>
  <div class="pop-foot">
    <span class="pop-hint">Ctrl/⌘ + Enter 保存</span>
    <button class="mini-btn ghost" id="markCancel">取消</button>
    <button class="mini-btn primary" id="markSave">保存</button>
  </div>
</div>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<input type="file" id="avatarFile" accept="image/*" hidden>

<!-- ============ 登录 ============ -->
<div class="login-view" id="loginView">
  <div class="login-card acrylic">
    <img class="login-logo" src="assets/icon.svg" alt="">
    <div class="login-title">图记</div>
    <div class="login-sub">在图片上标注，把想法说清楚</div>

    <div class="login-field">
      <label for="loginName">账号</label>
      <input type="text" id="loginName" placeholder="如：樱糖" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
    </div>
    <div class="login-field">
      <label for="loginPwd">密码</label>
      <input type="password" id="loginPwd" placeholder="至少 8 位，新账号自动注册" autocomplete="current-password" enterkeyhint="go">
    </div>

    <button class="login-btn" id="loginSubmit">登录</button>
    <div class="login-split"><span>或</span></div>
    <button class="login-ghost" id="loginGuest">以访客身份浏览公开图库</button>
    <div class="login-foot">新账号会在首次登录时自动创建</div>
  </div>
</div>

<script src="js/api.js?v=20261114-redesign"></script>
<script src="js/api-http.js?v=20261114-redesign"></script>
<script src="js/core.js?v=20261114-redesign"></script>
<script src="js/auth.js?v=20261114-redesign"></script>
<script src="js/sidebar.js?v=20261114-redesign"></script>
<script src="js/canvas.js?v=20261114-redesign"></script>
<script src="js/dock.js?v=20261114-redesign"></script>
<script src="js/modals.js?v=20261114-redesign"></script>
<script src="js/main.js?v=20261114-redesign"></script>
</body>
</html>
